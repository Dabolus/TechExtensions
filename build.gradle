plugins {
	id 'java'
	id 'java-library'
	id 'idea'
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version "${spotless_version}"
	id 'me.modmuss50.mod-publish-plugin' version "${publish_plugin_version}"
}

version = project.mod_version
group = project.maven_group

// Spotless + Palantir Java Format to keep styling consistent
spotless {
	java {
		importOrder()
		palantirJavaFormat "${palantir_java_format_version}"
	}
}

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
    name = "Jared's maven"
    url = "https://maven.blamejared.com/"
  }
	maven {
		name = "Gegy"
		url = uri("https://maven.gegy.dev")
	}
}

loom {
	accessWidenerPath = file "src/main/resources/techextensions.accesswidener"

	splitEnvironmentSourceSets()

	mods {
		"techextensions" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "TechReborn:TechReborn-${project.tech_reborn_version}"

	// We provide LambDynamicLights configuration, even if we don't directly depend on it
	localRuntime "dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:4.10.1+26.1.1"

	// To easily check and debug recipes in-game
	localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:29.5.0.24"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

publishMods {
    file = jar.archiveFile
    version = project.mod_version
    changelog = providers.environmentVariable("CHANGELOG").orElse("No changelog provided")
    type = providers.environmentVariable("RELEASE_CHANNEL").orElse("stable").map { value ->
        switch (value) {
            case "alpha": return ALPHA
            case "beta": return BETA
            default: return STABLE
        }
    }
    modLoaders.add("fabric")

    curseforge {
        projectId = "1430902"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add("26.1.2")
        minecraftVersions.add("26.1.1")
        minecraftVersions.add("26.1")
        requires("fabric-api", "techreborn")
        optional("jei", "lambdynamiclights")
    }
    modrinth {
        projectId = "So3gzRK5"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add("26.1.2")
        minecraftVersions.add("26.1.1")
        minecraftVersions.add("26.1")
        requires("fabric-api", "techreborn")
        optional("jei", "lambdynamiclights")
    }
    github {
        repository = "Dabolus/TechExtensions"
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        commitish = "main"
    }
}
