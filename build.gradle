plugins {
	id 'java'
	id 'java-library'
	id 'idea'
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'com.diffplug.spotless' version "${spotless_version}"
	id 'me.modmuss50.mod-publish-plugin' version "${publish_plugin_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

// Spotless + Palantir Java Format to keep styling consistent
spotless {
	java {
		importOrder()
		palantirJavaFormat "${palantir_java_format_version}"
	}
}

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
    name = "Jared's maven"
    url = "https://maven.blamejared.com/"
  }
	maven {
		name = "Gegy"
		url = uri("https://maven.gegy.dev")
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
		content {
			includeGroup "com.github.Virtuoel"
		}
	}
}

loom {
	accessWidenerPath = file "src/main/resources/techextensions.classtweaker"

	splitEnvironmentSourceSets()

	mods {
		"techextensions" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "TechReborn:TechReborn-${project.tech_reborn_version}"

	// Entity resizing for the Shrink Ray: Minecraft 1.20.1 has no scale attribute
	modImplementation "maven.modrinth:pehkui:${project.pehkui_version}"
	// Bundled in the Pehkui jar, but Loom drops nested jars from remapped dependencies
	modLocalRuntime("com.github.Virtuoel:KanosConfig:${project.kanos_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}

	// We provide LambDynamicLights configuration, even if we don't directly depend on it
	modLocalRuntime("dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:${project.lambdynamiclights_version}") {
		// Optional Mod Menu integration, not published on the repositories above for this version
		exclude group: "com.terraformersmc"
	}

	// To easily check and debug recipes in-game
	modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
	// Bundled in the JEI jar, but Loom drops nested jars from remapped dependencies
	modLocalRuntime "net.mezzdev.config:mezz_config-${project.minecraft_version}-fabric:${project.mezz_config_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraftDependency", project.minecraft_dependency

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version, "minecraftDependency": inputs.properties.minecraftDependency
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE.md") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// The GitHub release (one per mod version, with the jars of every supported Minecraft version)
// is created by the release workflow, so only CurseForge and Modrinth are configured here.
def publishMinecraftVersions = project.publish_minecraft_versions.split(",")*.trim()

publishMods {
    // The plain jar is the dev jar (Mojang names): publish the remapped one
    file = remapJar.archiveFile
    version = project.version.toString()
    changelog = providers.environmentVariable("CHANGELOG").orElse("").map { it.isBlank() ? "See the commit history for the list of changes." : it }
    type = providers.environmentVariable("RELEASE_CHANNEL").orElse("stable").map { value ->
        switch (value) {
            case "alpha": return ALPHA
            case "beta": return BETA
            default: return STABLE
        }
    }
    modLoaders.add("fabric")

    curseforge {
        projectId = "1430902"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.addAll(publishMinecraftVersions)
        client = true
        server = true
        requires("fabric-api", "techreborn", "pehkui")
        optional("jei", "lambdynamiclights")
    }
    modrinth {
        projectId = "So3gzRK5"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.addAll(publishMinecraftVersions)
        requires("fabric-api", "techreborn", "pehkui")
        optional("jei", "lambdynamiclights")
    }
}
